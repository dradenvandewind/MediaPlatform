version: "3.9"

networks:
  moq_net:
    driver: bridge

volumes:
  cmaf_cache_data:

services:

  receiver:
    image: dradenvandewind/media_over_quick_publisher:v1.0.0_moq_receiver
    # build:
    #   context: ./receiver
    #   dockerfile: Dockerfile
    container_name: moq_receiver
    networks:
      - moq_net
    ports:
      - "4443:4443/udp"
      - "5565:5565/tcp"   # video fMP4
      - "5566:5566/tcp"   # audio fMP4
    entrypoint: ["/usr/local/bin/receiver"]
    command:
      - "-quic=0.0.0.0:4443"
      - "-video-dest=0.0.0.0:5565"
      - "-audio-dest=0.0.0.0:5566"
      - "-no-raptorq"
    restart: unless-stopped

  publisher:
    image: dradenvandewind/media_over_quick_publisher:v1.0.0_moq_publisher

    # build:
    #   context: ./publisher
    #   dockerfile: Dockerfile
    # container_name: moq_publisher
    shm_size: '256mb'
    networks:
      - moq_net
    depends_on:
      - receiver
    environment:
      FPS:         ${FPS:-30}
      AUDIO_CODEC: ${AUDIO_CODEC:-aac}
      NO_RAPTORQ:  "1"
      URL:         "receiver:4443"
      TZ:          Europe/Paris
      
    #entrypoint: ["/bin/bash", "/run.sh"]
    #volumes:
    #  - ./publisher/run.sh:/run.sh:ro
    
    entrypoint: ["python3", "/run.py"]
    volumes:
      - ./publisher/run.py:/run.py:ro
      - /dev/video0:/dev/video0:rw
      - /dev/shm:/dev/shm:rw
      - /dev/snd:/dev/snd:rw

    restart: on-failure
  client-cmaf:
    # Utilisé pour les commandes CLI (ex: docker-compose exec publisher bash)
    # Pas besoin de build ou de volumes, juste un accès au réseau
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: moq_client
    #user: "101:101"
    networks:
      - moq_net
    depends_on:
      - receiver
    # ports:
    #   - "4443:4443/udp"
    #   - "5565:5565/tcp"   # video fMP4
    #   - "5566:5566/tcp"   # audio fMP4

    environment:
      VIDEO_PORT: ${VIDEO_PORT:-5565}
      AUDIO_PORT: ${AUDIO_PORT:-5566}
      LOG_LEVEL:  DEBUG

    entrypoint: ["python3", "/opt/moq_to_dash_hls_opti.py"]
    volumes:
      - ./client/moq_to_dash_hls_opti.py:/opt/moq_to_dash_hls_opti.py:ro
      - cmaf_cache_data:/var/cache/nginx
    
    #entrypoint: ["/bin/bash", "-c", "while true; do sleep 3600; done"]
  # backend:
  #   image: nginx:alpine
  #   container_name: backend
  #   volumes:
  #     - ./nginx/player:/usr/share/nginx/html:ro

  nginx-cache:
    image: nginx:alpine
    container_name: nginx-cache
    user: root  # workaround to write cache files with correct permissions
    depends_on:
      #- backend
      - client-cmaf
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx_cache.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/player:/usr/share/nginx/html:ro
      - cmaf_cache_data:/var/cache/nginx
    entrypoint: >
      sh -c "nginx -g 'daemon off;'"
    #environment:
    #  - UPSTREAM_HOST=backend
    restart: unless-stopped
    
    networks:
      - moq_net
  
  player:
    image: nginx:alpine
    environment:
      - TZ=Europe/Paris
    container_name: moq_player
    ports:
      - "8079:80"
    volumes:
      - ./nginx/player:/usr/share/nginx/html:ro
    networks:
      - moq_net

