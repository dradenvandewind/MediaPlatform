---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ott
  labels:
    app: orchestrator
    pipeline: ott
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        pipeline: ott
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 3
              done
        - name: wait-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "waiting for redis..."; sleep 3
              done
      containers:
        - name: orchestrator
          image: 192.168.1.29:5000/orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: OTT_REDIS_URL
              value: "redis://redis:6379"
            - name: OTT_DATABASE_URL
              value: "postgresql+asyncpg://ott:ott@postgres:5432/ott"
            - name: OTT_LOG_LEVEL
              value: "info"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: ott
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
